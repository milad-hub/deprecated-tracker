name: Deprecation badge

# The tool used on itself. The badge in the README is generated by the scanner
# in this checkout, not by a published release, so it always reports what the
# code on `main` actually contains.
# Every push, with no path filter. The scan builds its program from whatever
# tsconfig.json or jsconfig.json it discovers, so an include, an exclude, a
# project reference or a compiler option can move the count without touching
# src/ - and a filter that has to list every input is a filter that will be
# wrong the first time one is added. The job takes a minute.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two pushes landing together would race to commit the same file. The second
# run waits rather than being cancelled: it is the one that measured the newer
# tree, so its answer is the one worth keeping.
concurrency:
  group: deprecation-badge
  cancel-in-progress: false

jobs:
  badge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run bundle:cli

      # Exit 1 means the count rose above the baseline, which is the push where
      # the badge most needs rewriting, so it must not stop the commit below.
      # Exit 2 and 3 are real failures and still fail the job rather than
      # leaving a stale badge under a green tick.
      - name: Measure
        run: |
          node bin/deprecated-tracker.js . \
            --config .github/deprecated-tracker.json \
            --format shields \
            --output .github/badges/deprecated.json \
            --quiet || [ "$?" -eq 1 ]

      - name: Commit the badge if the number moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/deprecated.json
          git diff --cached --quiet || git commit -m "chore: refresh the deprecation badge"
          git push
