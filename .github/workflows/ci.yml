name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repo. Set it at the top so a job cannot inherit
# more than it needs if the repository default is ever widened.
permissions:
  contents: read

# Superseded PR runs are pointless; a superseded main run is not, because the
# code-scanning and alert state for main is keyed to it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20]
        include:
          # engines says >=18, so the floor is tested too.
          - os: ubuntu-latest
            node: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc -p ./ --noEmit
      - run: npm test

  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Thresholds are 100%. Run this on one platform only: the same line can be
      # unreachable on another OS, and three platforms cannot all hit 100% of
      # code that branches on process.platform.
      - run: npm run test:coverage

  # Dependabot reports a vulnerable dependency once it is already on main. This
  # fails the pull request that introduces one. The action reads the diff
  # between base and head, so it has nothing to compare on a push.
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # The action defaults to `runtime` alone. This package declares no
          # runtime dependencies, so that default makes the job pass
          # unconditionally — a gate that can never fail is worse than none,
          # because it reads like coverage. Every dependency here is a
          # development one, which is exactly what needs reviewing.
          fail-on-scopes: runtime, development

  cli:
    name: packaged CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Install the tarball the way a user would, so PATH shims, the shebang
      # and the bin mapping are all exercised rather than assumed.
      - name: Pack and install globally
        shell: bash
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
          # `./` is load-bearing: npm reads a bare `a/b` argument as the GitHub
          # shorthand owner/repo and tries to clone it over SSH.
          npm install -g ./artifacts/deprecated-tracker-*.tgz

      - name: Version and help
        shell: bash
        run: |
          deprecated-tracker --version
          deprecated-tracker --help
          # The bare name must print help rather than scan whatever $PWD is.
          deprecated-tracker | grep -q 'deprecated-tracker \[path\]'

      - name: Scan a real project
        shell: bash
        run: |
          mkdir -p smoke/src && cd smoke
          git init -q . && git config user.email ci@example.com && git config user.name ci
          echo '{"compilerOptions":{"target":"ES2020"},"include":["src"]}' > tsconfig.json
          printf '/** @deprecated Use freshApi */\nexport function oldApi(): void {}\n' > src/api.ts
          printf 'import { oldApi } from "./api";\nexport function go(): void { oldApi(); }\n' > src/use.ts
          if deprecated-tracker --format json --fail-on-any > report.json; then
            echo "expected exit 1 from --fail-on-any with findings"; exit 1
          fi
          node -e "const r=require('./report.json'); if(r.total<2){console.error('expected findings, got',r.total);process.exit(1)}"

      - name: Scan uncommitted work
        shell: bash
        working-directory: smoke
        run: |
          deprecated-tracker --changed --format json > changed.json || true
          node -e "const r=require('./changed.json'); if(!r.items){console.error('no items array');process.exit(1)}"

      - name: Custom tags from config
        shell: bash
        working-directory: smoke
        run: |
          echo '{"customTags":[{"tag":"@legacy","description":"Old"}]}' > .deprecatedtrackerrc
          printf '/** @legacy Use freshApi */\nexport function legacyApi(): void {}\n' > src/legacy.ts
          if deprecated-tracker --format json --fail-on-any > tagged.json; then
            echo "expected exit 1 with a custom-tag finding"; exit 1
          fi
          node -e "const r=require('./tagged.json'); if(!r.items.some(i=>i.name==='legacyApi')){console.error('custom tag not honoured');process.exit(1)}"

      - name: MCP handshake over stdio
        shell: bash
        working-directory: smoke
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | deprecated-tracker mcp > mcp.jsonl
          node -e "
            const lines = require('fs').readFileSync('mcp.jsonl','utf8').trim().split('\n').map(JSON.parse);
            if (lines.length !== 2) { console.error('expected 2 frames, got', lines.length); process.exit(1); }
            const names = lines[1].result.tools.map(t => t.name).sort().join(',');
            if (names !== 'scan_changes,scan_files,scan_project') { console.error('unexpected tools:', names); process.exit(1); }
          "

      - name: MCP install and uninstall
        shell: bash
        working-directory: smoke
        run: |
          deprecated-tracker mcp install --agent claude-code --scope project
          node -e "
            const c = require('./.mcp.json');
            if (!c.mcpServers['deprecated-tracker']) { console.error('not registered'); process.exit(1); }
          "
          deprecated-tracker mcp uninstall --agent claude-code --scope project
          node -e "
            const c = require('./.mcp.json');
            if (c.mcpServers['deprecated-tracker']) { console.error('not removed'); process.exit(1); }
          "

  # The action is a wrapper, so what can break is the wrapping: argument
  # assembly, the outputs, and bash-on-Windows. It runs against the tarball
  # built here rather than the published package, so a change to the CLI is
  # caught by this job before it can reach a tag.
  action:
    name: composite action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Install the CLI the action will call
        shell: bash
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
          npm install -g ./artifacts/deprecated-tracker-*.tgz

      - name: A project with one deprecated symbol and two call sites
        shell: bash
        run: |
          mkdir -p fixture/src
          echo '{"compilerOptions":{"target":"ES2020"},"include":["src"]}' > fixture/tsconfig.json
          printf '/** @deprecated Use freshApi */\nexport function oldApi(): void {}\n' > fixture/src/api.ts
          printf 'import { oldApi } from "./api";\nexport function go(): void { oldApi(); }\n' > fixture/src/use.ts

      - name: Run the action
        id: scan
        uses: ./
        with:
          path: fixture
          version: ""
          upload-sarif: "false"
          fail-on-regression: "false"
          sarif-file: fixture.sarif

      - name: Check what it reported
        shell: bash
        env:
          DT_TOTAL: ${{ steps.scan.outputs.total }}
          DT_HIDDEN: ${{ steps.scan.outputs.hidden }}
          DT_SOURCE: ${{ steps.scan.outputs.config-source }}
          DT_SARIF: ${{ steps.scan.outputs.sarif-file }}
          DT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          set -euo pipefail
          test -f "$DT_SARIF"
          # One declaration and two usages, and no baseline to fail against.
          test "$DT_TOTAL" = "3"
          test "$DT_HIDDEN" = "0"
          test "$DT_SOURCE" = "built-in defaults"
          test "$DT_CODE" = "0"
          node -e "
            const read = (file) => JSON.parse(require('fs').readFileSync(file, 'utf8'));
            const run = read('./fixture.sarif').runs[0];
            if (run.results.length !== 3) { console.error('sarif results', run.results.length); process.exit(1); }
            if (!run.properties || run.properties.configSource !== 'built-in defaults') {
              console.error('no provenance in the sarif'); process.exit(1);
            }
          "

      - name: A rule outside the tree wins, and the ratchet fails on a rise
        id: pinned
        continue-on-error: true
        uses: ./
        with:
          path: fixture
          version: ""
          upload-sarif: "false"
          fail-on-any: "true"
          summary: "false"
          sarif-file: pinned.sarif

      - name: The failing run still failed, and still wrote its report
        shell: bash
        env:
          DT_OUTCOME: ${{ steps.pinned.outcome }}
          DT_CODE: ${{ steps.pinned.outputs.exit-code }}
        run: |
          set -euo pipefail
          test "$DT_OUTCOME" = "failure"
          test "$DT_CODE" = "1"
          test -f pinned.sarif
