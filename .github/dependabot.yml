version: 2
updates:
  # The actions above are pinned to commit SHAs, which is only maintainable if
  # something proposes the bumps. npm is deliberately absent: security updates
  # are already enabled for it, and version updates on a dev-only tree would be
  # weekly noise against a lockfile that gates on 100% coverage.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
